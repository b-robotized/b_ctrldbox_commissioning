# Test of this robot in the b»controlled box bundle (test-commissioning.sh in b_controlled_box).
# description_launch: package, launch file, and arguments that publish the robot description.
#   Robot address 127.0.0.2: without a robot, an unused local address refuses the connection at once.
# mock_hardware_arguments: arguments added for mock hardware.
# controllers_file: package://<package>/<path> or a path in this repository.
# controllers: controllers to load from controllers_file.
# not_activated_with_mock_hardware: controllers that cannot be active with mock hardware, with
#   the reason. The test only loads and configures them.
# mock_hardware_controllers_file: controllers_file for mock hardware.

description_launch: [b_robotized_franka_demo, franka_description.launch.xml, robot_ip:=127.0.0.2]
mock_hardware_arguments: [ros2_control_hardware_type:=mock]
controllers_file: package://b_robotized_franka_demo/config/scenario_controllers.yaml
mock_hardware_controllers_file: package://b_robotized_franka_demo/config/scenario_controllers_mock.yaml
controllers:
  - joint_state_broadcaster
  - fr3_joint_trajectory_controller
