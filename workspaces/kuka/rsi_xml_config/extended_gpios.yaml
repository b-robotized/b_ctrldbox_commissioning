# RSI XML message configuration for the "extended_gpios" variant (RSI 4.1.x / KSS 8.6):
# the "extended" variant plus 8 digital inputs and 12 digital outputs.
#
# Pass this file to the driver with `rsi_xml_config_file:=<absolute path>` and `use_gpio:=true`.
# It is also the single source of truth for the controller-side ethernet config:
#
#   ros2 run kuka_rsi_driver generate_krc_rsi_config.py --config extended_gpios.yaml \
#     --client-ip 10.23.23.28 --client-port 28283 --output b_ctrldbox_rsi_eth.xml
#
# Regenerate kss_deployment/Config/User/Common/SensorInterface/common/extended_gpios/b_ctrldbox_rsi_eth.xml
# whenever this file changes. Elements without an INDX ("DEF_*") are KRC built-ins; elements
# with an INDX must be wired in the .rsix.
#
# The GPIO names below must match the gpio state/command interfaces declared in the robot
# description (gpio_config.xacro) - the driver refuses to start if the state counts differ.
# The signal names are generic placeholders and the robot I/O numbers an example mapping -
# rename/remap them for your application (YAML, .rsix and gpio_config.xacro together):
#   inputs  INDX 7-14  <- DigIn  $IN[132]..$IN[139]
#   outputs INDX 8-19  -> Map2DigOut $OUT[33]..$OUT[36], $OUT[39]..$OUT[46]

rsi_xml_config:
  motion_state:                    # robot -> PC
    cartesian:                     # actual TCP pose (active $TOOL in active $BASE) -> read_cartesian_pose:=true
      enabled: true
      xml_element: RIst            # DEF_RIst, built-in
      xml_attributes: [X, Y, Z, A, B, C]
    cartesian_setpoint:            # setpoint pose -> read_cartesian_setpoint:=true
      enabled: true                # disabled by default, must be set explicitly
      xml_element: RSol            # DEF_RSol, built-in
      xml_attributes: [X, Y, Z, A, B, C]
    joints:
      positions:                   # DEF_AIPos, built-in
        - {joint_identifier: joint_1, xml_element: AIPos, xml_attribute: A1}
        - {joint_identifier: joint_2, xml_element: AIPos, xml_attribute: A2}
        - {joint_identifier: joint_3, xml_element: AIPos, xml_attribute: A3}
        - {joint_identifier: joint_4, xml_element: AIPos, xml_attribute: A4}
        - {joint_identifier: joint_5, xml_element: AIPos, xml_attribute: A5}
        - {joint_identifier: joint_6, xml_element: AIPos, xml_attribute: A6}
      currents:                    # motor currents, DEF_MACur, built-in -> joint "current" state interface
        - {joint_identifier: joint_1, xml_element: MACur, xml_attribute: A1}
        - {joint_identifier: joint_2, xml_element: MACur, xml_attribute: A2}
        - {joint_identifier: joint_3, xml_element: MACur, xml_attribute: A3}
        - {joint_identifier: joint_4, xml_element: MACur, xml_attribute: A4}
        - {joint_identifier: joint_5, xml_element: MACur, xml_attribute: A5}
        - {joint_identifier: joint_6, xml_element: MACur, xml_attribute: A6}
      torques:                     # GearTorque_1 (Measured, Gear) -> INDX 1-6 -> joint "effort" state interface
        - {joint_identifier: joint_1, xml_element: GearTorque, xml_attribute: A1}
        - {joint_identifier: joint_2, xml_element: GearTorque, xml_attribute: A2}
        - {joint_identifier: joint_3, xml_element: GearTorque, xml_attribute: A3}
        - {joint_identifier: joint_4, xml_element: GearTorque, xml_attribute: A4}
        - {joint_identifier: joint_5, xml_element: GearTorque, xml_attribute: A5}
        - {joint_identifier: joint_6, xml_element: GearTorque, xml_attribute: A6}
    robot_status:                  # Status_1 (ProState_R) -> INDX 15, OV_PRO_1 -> INDX 16 -> read_robot_status:=true
      program_state: {xml_element: ProgStatus, xml_attribute: R, type: LONG}  # $PRO_STATE1
      speed_scaling: {xml_element: OvPro, xml_attribute: R}                   # $OV_PRO
    gpio:                          # digital inputs -> INDX 7-14 (DigIn $IN[132..139])
      xml_element: GPIO
      xml_attributes:
        - input_01                 # $IN[132]
        - input_02                 # $IN[133]
        - input_03                 # $IN[134]
        - input_04                 # $IN[135]
        - input_05                 # $IN[136]
        - input_06                 # $IN[137]
        - input_07                 # $IN[138]
        - input_08                 # $IN[139]

  control_signal:                  # PC -> robot
    joints:
      xml_element: AK
      xml_attributes: [A1, A2, A3, A4, A5, A6]
    gpio:                          # digital outputs -> INDX 8-19 (Map2DigOut)
      xml_element: GPIO
      xml_attributes:              # used by generate_krc_rsi_config.py; the driver takes them from the URDF
        - output_01                # $OUT[33]
        - output_02                # $OUT[34]
        - output_03                # $OUT[35]
        - output_04                # $OUT[36]
        - output_05                # $OUT[39]
        - output_06                # $OUT[40]
        - output_07                # $OUT[41]
        - output_08                # $OUT[42]
        - output_09                # $OUT[43]
        - output_10                # $OUT[44]
        - output_11                # $OUT[45]
        - output_12                # $OUT[46]
